## Harbor job config — run all tasks with claude and codex agents
##
## Usage:
##   harbor run -c harbor-scripts/job_config.yaml
##
## Override tasks:
##   harbor run -c harbor-scripts/job_config.yaml -t hasnain2024
##
## Use podman instead of docker:
##   harbor run -c harbor-scripts/job_config.yaml --ek use_podman=true
##
## Notes:
##   - Auth env vars (ANTHROPIC_API_KEY, OPENAI_API_KEY, etc.) must be
##     set before running. Use `source .env` or run_harbor.sh --apikeys.
##   - n_concurrent_trials=1 to avoid GPU contention.

n_attempts: 3

orchestrator:
  n_concurrent_trials: 2

datasets:
  - path: harbor-tasks
    task_names:
      - map

agents:
  - name: claude-code
    model_name: claude-opus-4-6
  - name: codex
    model_name: gpt-5.4
