services:
  main:
    volumes:
      # Read-only, and NOT at /app/data: the entrypoint (environment/stage_cache.sh)
      # assembles a writable ONE cache at /app/data/one_cache from this mount, because
      # ONE writes REST responses and refreshes release tables while it reads. Mounting
      # the dataset writable instead -- as this task used to -- required rootless podman
      # on Kerberos-squashed NFS, let concurrent trials write into one shared tree, and
      # let an agent modify the dataset.
      - "${DATA_ROOT:?DATA_ROOT must be set - run via harbor-scripts/run_harbor.sh}/zhang2025:/mnt/dataset:ro"
    # Alyx is unreachable from this task, on purpose. The dataset ships a cache of
    # Alyx's answers (one_cache/.rest) whose expiry is set 50 years out, so the
    # reference solution reads it from disk and never asks the server. Leaving the
    # server reachable would mean a query missing from that cache silently succeeds
    # over the network instead of failing -- the converted data, and so the reference
    # statistics, would then depend on what Alyx returned that day. On the datalimit
    # task it would also let an agent fetch sessions outside the 50 GB subset the task
    # is defined by. Only this hostname is blocked; the rest of the internet works,
    # because the agent's tooling needs it.
    extra_hosts:
      - "openalyx.internationalbrainlab.org:127.0.0.1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
