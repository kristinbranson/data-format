name: test-decoder-data-format
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      # Pull torch wheels from the PyTorch CUDA-12.4 index in addition to PyPI.
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - torchvision==0.21.0
      # Core scientific stack + task-specific data-loading packages.
      - numpy
      - scipy
      - matplotlib
      - tqdm
      - opencv-python
      - scikit-learn
      - h5py
      - pandas
      - pynwb
      - dandi
      - ONE-api
      - suite2p
      - allensdk@git+https://github.com/AllenInstitute/AllenSDK.git
      - sentence-transformers
      # Test runner used by test_outputs.py and verifier pipeline.
      - pytest
      - pytest-json-ctrf
